<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial; width: 350px; padding: 10px; }
    textarea { width: 100%; height: 150px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; margin-top: 8px; padding: 8px; font-size: 14px; cursor: pointer; }
    #status { margin-top: 8px; font-size: 12px; display: none; padding: 6px; border-radius: 4px; }
    #status.success { background: #d4edda; color: #155724; display: block; }
    #status.error   { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>
  <b>CodeHS Paster</b>
  <br>
  <textarea id="code" placeholder="Paste your code here..."></textarea>
  <button id="injectBtn">Inject into CodeHS</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
