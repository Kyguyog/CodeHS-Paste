<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial; width: 210px; padding: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    label { font-size: 14px; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 24px;
      cursor: pointer; transition: 0.2s;
    }
    .slider:before {
      content: ""; position: absolute;
      width: 18px; height: 18px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: #4caf50; }
    input:checked + .slider:before { transform: translateX(20px); }
    .indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: #444;
      padding: 5px 8px; border-radius: 6px;
      background: #f0f0f0;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .dot.blocked  { background: #e53935; }
    .dot.allowed  { background: #43a047; }
    .dot.unknown  { background: #aaa; }
  </style>
</head>
<body>
  <div class="row">
    <label>Paste intercept</label>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="indicator">
    <div class="dot unknown" id="dot"></div>
    <span id="pasteStatus">Checking...</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
